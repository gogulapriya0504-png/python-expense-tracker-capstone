<!DOCTYPE html>
<html>
<head>
    <title>Smart Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-center mb-4">💰 Smart Expense Tracker - Capstone Project</h2>

    <div class="card p-3 mb-4">
        <h4>Total Expense: ₹{{ total }}</h4>
        <form action="/add" method="POST" class="row g-3">
            <div class="col-md-2"><input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount" required></div>
            <div class="col-md-2">
                <select name="category" class="form-control" required>
                    <option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Other</option>
                </select>
            </div>
            <div class="col-md-3"><input type="text" name="description" class="form-control" placeholder="Note"></div>
            <div class="col-md-2"><input type="date" name="date" class="form-control" required></div>
            <div class="col-md-3"><button class="btn btn-primary w-100">Add Expense</button></div>
        </form>
    </div>

    <table class="table table-dark table-striped">
        <tr><th>ID</th><th>Amount</th><th>Category</th><th>Note</th><th>Date</th><th>Action</th></tr>
        {% for e in expenses %}
        <tr><td>{{ e[0] }}</td><td>₹{{ e[1] }}</td><td>{{ e[2] }}</td><td>{{ e[3] }}</td><td>{{ e[4] }}</td><td><a href="/delete/{{ e[0] }}" class="btn btn-danger btn-sm">Delete</a></td></tr>
        {% endfor %}
    </table>
    <p class="text-center">Built by Gogula Priya | Python Capstone 2025</p>
</div>
</body>
</html>
